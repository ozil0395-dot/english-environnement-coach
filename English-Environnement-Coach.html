HSE, un compte rendu.`,lessons:[{id:`m10-l1`,title:`Professional writing`,goals:[`Structurer un email professionnel`,`Formuler une demande et une relance polies`],vocab:[P(`m10-1`,`Dear Mr / Ms …,`,`Monsieur / Madame, (début d'email)`,`Dear Mr Smith,`,`Écriture`),P(`m10-2`,`I am writing to …`,`Je vous écris pour…`,`I am writing to request the removal of contaminated sand.`,`Écriture`),P(`m10-3`,`Please find attached …`,`Veuillez trouver ci-joint…`,`Please find attached the inspection report.`,`Écriture`),P(`m10-4`,`I would appreciate it if …`,`Je vous serais reconnaissant de…`,`I would appreciate it if you could confirm by Thursday.`,`Écriture`),P(`m10-5`,`Kind regards,`,`Cordialement,`,`Kind regards, Hicham Foul`,`Écriture`),P(`m10-6`,`minutes of the meeting`,`compte rendu de réunion`,`I will send the minutes of the meeting today.`,`Écriture`),P(`m10-7`,`further to …`,`suite à…`,`Further to our discussion, please find the action list.`,`Écriture`)],examples:[`Dear Mr Smith, I am writing to request the removal of contaminated sand from the workshop.`,`Please find attached the photos taken during the inspection.`,`I would appreciate it if you could confirm the date by Thursday. Kind regards,`],exercises:[F(`m10-e1`,`The best opening for a formal email is:`,[`Hey,`,`Dear Mr Smith,`,`Yo Smith,`],1,`Dear Mr / Ms + nom : formel.`,`ecriture`),I(`m10-e2`,`Please find ___ the inspection report. (ci-joint)`,[`attached`],`Please find attached = veuillez trouver ci-joint.`,`ecriture`),F(`m10-e3`,`Choose the most polite request:`,[`Send me the report.`,`I would appreciate it if you could send me the report.`,`You must send the report.`],1,`Formule polie standard.`,`ecriture`),I(`m10-e4`,`I am writing ___ request the removal of the waste. (pour)`,[`to`],`I am writing to + verbe.`,`ecriture`),or(`m10-e5`,`Traduis : « Veuillez confirmer avant jeudi. »`,[`please confirm by thursday`,`please confirm before thursday`,`could you please confirm by thursday`],`Modèle : Please confirm by agement on site`,`i am responsible for waste management on site`,`i am in charge of waste management on the site`,`i am responsible for waste management on the site`],`Modèle : I am in charge of waste management on site.`)]}]}],kr=Or.flatMap(e=>e.lessons)}));function jr(e,t,n){return`You are "Coach", a patient English teacher for a French-speaking learner. Learner profile: ${t||`an environmental engineer in a pipeline construction and maintenance company in the Algerian oil and gas sector. Needs English for site inspections, waste, water, soil and pollution topics, spills, PPE, ISO 14001, emails and reports, and for talking with foreign welders, supervisors and subcontractors.`} Estimated level: ${n||`unknown, infer it from the text`}.\nRules: reply ONLY with a JSON object. Be precise and brief. Write explanations in French and examples in English tied to real work (environment, waste, spills, inspections, PPE, pipelines). If the text is already correct, say so in explanation_fr and return an empty errors list: never invent errors. Classify each error as one of "grammaire", "vocabulaire", "formulation", "compréhension". You only see text: never comment on pronunciation. If a technical translation is uncertain, say so. Never ask for confidential company data.
